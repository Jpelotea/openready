<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9aacd4" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#7f96cc" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#7f96cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6deef" stop-opacity="0.9"/>
      <stop offset="0.52" stop-color="#9aacd4" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#7d739f" stop-opacity="0.72"/>
    </linearGradient>
    <style>
      .wireframe {
        transform-origin: 320px 320px;
        animation: orbit-turn 42s linear infinite;
      }
      .panels {
        transform-origin: 320px 320px;
        animation: panel-drift 12s ease-in-out infinite alternate;
      }
      .cage {
        fill: none;
        stroke: #8ca0cf;
        stroke-width: 1.35;
        opacity: 0.58;
      }
      .link {
        fill: none;
        stroke: #98acd8;
        stroke-width: 1;
        opacity: 0.4;
      }
      .node {
        fill: #aebce0;
        stroke: #24334f;
        stroke-width: 2;
      }
      .tile {
        fill: url(#tile);
        stroke: #dbe3f2;
        stroke-width: 1.1;
      }
      .tile.far { opacity: 0.46; }
      .tile.mid { opacity: 0.7; }
      .tile.near { opacity: 0.92; }
      .mark {
        fill: none;
        stroke: #344665;
        stroke-width: 2.2;
        stroke-linecap: round;
        opacity: 0.55;
      }
      @keyframes orbit-turn {
        from { transform: rotate(-4deg); }
        to { transform: rotate(356deg); }
      }
      @keyframes panel-drift {
        from { transform: translateY(-5px) rotate(-1.5deg); }
        to { transform: translateY(7px) rotate(2deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wireframe,
        .panels { animation: none; }
      }
    </style>
  </defs>

