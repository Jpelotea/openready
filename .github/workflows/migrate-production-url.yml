name: Migrate production URL

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-production-url.yml"

permissions:
  contents: write

jobs:
  migrate-url:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace the previous Netlify URL
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "https://capable-chaja-458cb0.netlify.app"
          new = "https://getopenready.netlify.app"
          paths = [
              Path("index.html"),
              Path("README.md"),
              Path("getting-started.md"),
              Path("docs/production-audit.md"),
              Path("lighthouserc.production.json"),
              Path("data/site.json"),
              Path(".github/workflows/lighthouse-production.yml"),
          ]

          changed = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          if not changed:
              raise SystemExit("No previous production URL references were found.")

          print("Updated:")
          print("\n".join(changed))
          PY

      - name: Remove this one-time workflow
        run: rm .github/workflows/migrate-production-url.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md getting-started.md docs/production-audit.md lighthouserc.production.json data/site.json .github/workflows/lighthouse-production.yml .github/workflows/migrate-production-url.yml
          git commit -m "chore: update production URL to getopenready"
          git push

# One-time migration trigger
