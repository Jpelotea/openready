name: Browser accessibility checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "docs-grid.css"
      - "hero-orbit.svg"
      - "app.js"
      - "profile.js"
      - "data/**"
      - "tests/**"
      - "playwright.config.js"
      - ".github/workflows/browser-accessibility.yml"
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "docs-grid.css"
      - "hero-orbit.svg"
      - "app.js"
      - "profile.js"
      - "data/**"
      - "tests/**"
      - "playwright.config.js"
      - ".github/workflows/browser-accessibility.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.52.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 8080 > /tmp/openready-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/openready-server.log
          exit 1

      - name: Run browser accessibility checks
        run: npx playwright test

      - name: Capture README interface screenshot
        if: always()
        run: |
          mkdir -p screenshot-artifact docs/images
          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1050 },
              colorScheme: 'light',
              deviceScaleFactor: 1
            });

            await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle' });
            await page.waitForSelector('#checklistForm input[type="checkbox"]', { timeout: 15000 });

            await page.fill('#profileName', 'OpenReady');
            await page.fill('#profileRepository', 'https://github.com/Jpelotea/openready');
            await page.fill('#profileMaintainer', 'OpenReady contributors');

            const checklistItems = page.locator('#checklistForm input[type="checkbox"]');
            const availableItems = await checklistItems.count();
            for (let index = 0; index < Math.min(4, availableItems); index += 1) {
              await checklistItems.nth(index).check();
            }

            await page.evaluate(() => {
              const section = document.querySelector('#checklist');
              window.scrollTo(0, Math.max(0, section.offsetTop - 24));
            });
            await page.waitForTimeout(700);

            await page.screenshot({
              path: 'screenshot-artifact/openready-interface-v0.3.0.png',
              fullPage: false
            });

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          cp screenshot-artifact/openready-interface-v0.3.0.png docs/images/openready-interface-v0.3.0.png

      - name: Commit verified README screenshot
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/openready-interface-v0.3.0.png
          if git diff --cached --quiet; then
            echo "Screenshot is already current."
            exit 0
          fi
          git commit -m "docs: add current OpenReady interface screenshot"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload README screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openready-readme-screenshot
          path: screenshot-artifact/openready-interface-v0.3.0.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-accessibility-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
