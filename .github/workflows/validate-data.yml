name: Validate project data

on:
  push:
    paths:
      - "data/**"
      - "scripts/validate_data.py"
      - "scripts/validate_guidance.py"
      - "scripts/validate_project_scope.py"
      - "tests/test_validators.py"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate_data.py"
      - "scripts/validate_guidance.py"
      - "scripts/validate_project_scope.py"
      - "tests/test_validators.py"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-data:
    name: Validate JSON content and configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate OpenReady data
        run: |
          python scripts/validate_data.py
          python scripts/validate_guidance.py
          python scripts/validate_project_scope.py

      - name: Run validator regression tests
        run: python tests/test_validators.py
